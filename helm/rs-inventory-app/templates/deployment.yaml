apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs-inventory-app
  labels:
    app: rs-inventory-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rs-inventory-app
  template:
    metadata:
      labels:
        app: rs-inventory-app
    spec:
      containers:
      - name: rs-inventory-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
